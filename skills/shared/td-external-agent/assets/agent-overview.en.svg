<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="320" viewBox="0 0 1050 320" role="img" aria-labelledby="title desc">
  <title id="title">Call an external agent from your current session</title>
  <desc id="desc">The current Codex or Claude Code session uses td-external-agent to select one CLI: tcodex, tclaude, CodeBuddy or dsh. It specifies a model and effort level, delegates a task to an independent agent acting as a Coder, Reviewer or researcher, and checks the returned result.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9ff"/>
      <stop offset="1" stop-color="#f3f1fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#8b7bb8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #292538; }
    .heading { font-size: 24px; font-weight: 650; }
    .body { font-size: 22px; }
    .muted { font-size: 18px; fill: #746987; }
    .accent { fill: #6b46c1; }
    .connector { fill: none; stroke: #8b7bb8; stroke-width: 1.8; marker-end: url(#arrow); }
  </style>
  <rect x="1" y="1" width="1048" height="318" rx="20" fill="url(#background)" stroke="#e9e3f5"/>

  <rect x="28" y="32" width="220" height="190" rx="14" fill="#fff" stroke="#e2dced"/>
  <text x="54" y="75" class="heading">Current session</text>
  <text x="54" y="128" class="body">Codex</text>
  <text x="54" y="164" class="body">Claude Code</text>
  <text x="54" y="198" class="muted">Your current tool</text>

  <text x="288" y="108" class="muted" style="font-size:14px" text-anchor="middle">Delegate</text>
  <path d="M260 128 H316" class="connector"/>

  <rect x="330" y="32" width="390" height="190" rx="14" fill="#f0eafb" stroke="#cdbce9"/>
  <text x="525" y="75" class="heading accent" text-anchor="middle">td-external-agent</text>
  <rect x="348" y="100" width="76" height="42" rx="8" fill="#fff" stroke="#ded4f0"/>
  <rect x="432" y="100" width="82" height="42" rx="8" fill="#fff" stroke="#ded4f0"/>
  <rect x="522" y="100" width="104" height="42" rx="8" fill="#fff" stroke="#ded4f0"/>
  <rect x="634" y="100" width="68" height="42" rx="8" fill="#fff" stroke="#ded4f0"/>
  <text x="386" y="128" font-size="18" text-anchor="middle">tcodex</text>
  <text x="473" y="128" font-size="18" text-anchor="middle">tclaude</text>
  <text x="574" y="128" font-size="18" text-anchor="middle">CodeBuddy</text>
  <text x="668" y="128" font-size="18" text-anchor="middle">dsh</text>
  <text x="525" y="170" class="muted" text-anchor="middle">Choose one CLI</text>
  <text x="525" y="201" font-size="20" class="accent" text-anchor="middle">Choose model + effort</text>

  <text x="760" y="108" class="muted" text-anchor="middle">Run</text>
  <path d="M734 128 H788" class="connector"/>

  <rect x="802" y="32" width="220" height="190" rx="14" fill="#fff" stroke="#e2dced"/>
  <text x="828" y="75" class="heading" style="font-size:20px">Independent Agent</text>
  <text x="828" y="119" font-size="20">Coder · Code</text>
  <text x="828" y="155" font-size="20">Reviewer · Review</text>
  <text x="828" y="191" font-size="20">Research · Find</text>

  <path d="M912 234 V270 H138 V234" class="connector" stroke-dasharray="5 5"/>
  <rect x="298" y="253" width="454" height="34" rx="17" fill="#f6f3fd"/>
  <text x="525" y="276" class="muted" style="font-size:16px" text-anchor="middle">Return results for the current session to check</text>
</svg>
